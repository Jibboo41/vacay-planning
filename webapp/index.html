<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!-- iOS Safari: fills the full screen, no bounce scrolling on body -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Safari: enables Add to Home Screen full-screen mode -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vacay" />
    <!-- Theme color for browser chrome -->
    <meta name="theme-color" content="#000000" />
    <!-- SEO -->
    <meta name="description" content="Plan your next adventure. View your travel itinerary and destinations on a map." />
    <title>Vacay — Travel Planner</title>
  </head>
  <body>
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        var root = document.getElementById('root');
        if (root) {
          var errorName = error ? (error.name + ': ') : '';
          var fullMessage = errorName + (error ? error.message : msg);
          var stack = error ? error.stack : '';
          
          // Handle "Script error." which is generic due to CORS or browser interrupts (common on iOS Share)
          if (msg === 'Script error.' || (!url && lineNo === 0)) {
             // If we have a real error object with a stack, it might still be a real issue.
             // But if it's just "Script error." with no info, it's a browser noise event.
             if (!error || !error.stack || error.stack.length < 10) {
                console.warn('Suppressed noisy browser error:', msg);
                return; 
             }
             fullMessage = 'Script Error: An external resource failed. Check console for details.';
          }

          root.innerHTML = '<div style="background:#0F1014;color:#fff;padding:40px 20px;font-family:-apple-system, system-ui, sans-serif;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">' +
            '<div style="font-size:4rem;margin-bottom:20px;">⚠️</div>' +
            '<h1 style="color:#FF3B30;font-size:18px;font-weight:800;letter-spacing:0.05em;margin:0 0 10px 0;">SYSTEM FATAL ERROR</h1>' +
            '<p style="font-size:14px;line-height:1.6;color:#fafafa;max-width:500px;margin:0 auto 20px auto;">' + fullMessage + '</p>' +
            (stack ? '<div style="font-size:10px;color:#888;background:rgba(255,255,255,0.05);padding:15px;border-radius:12px;text-align:left;max-width:90%;overflow:auto;max-height:200px;margin-bottom:30px;font-family:monospace;white-space:pre-wrap;">' + stack + '</div>' : '') +
            '<p style="font-size:11px;color:#555;margin-bottom:30px;">' + (url || 'unknown-file') + ' (L:' + lineNo + ' C:' + columnNo + ')</p>' +
            '<button onclick="window.location.reload()" style="padding:14px 28px;background:#fff;color:#000;border:none;border-radius:14px;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 10px 20px rgba(0,0,0,0.3);">RELOAD APP</button>' +
            '</div>';
        }
        return false;
      };
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
