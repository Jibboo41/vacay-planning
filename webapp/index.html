<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vacay-mark.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/vacay-icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/vacay-apple-touch-icon.png" />
    <!-- iOS Safari: fills the full screen, no bounce scrolling on body -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Safari: enables Add to Home Screen full-screen mode -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vacay" />
    <!-- Theme color for browser chrome -->
    <meta name="theme-color" content="#000000" />
    <script>
      try {
        var appearance = localStorage.getItem('vacay_appearance') === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.appearance = appearance;
        document.documentElement.style.colorScheme = appearance;
        document.querySelector('meta[name="theme-color"]').content = appearance === 'light' ? '#f0f2f8' : '#0f1014';
      } catch (_) {}
    </script>
    <!-- SEO -->
    <meta name="description" content="Plan your next adventure. View your travel itinerary and destinations on a map." />
    <title>Vacay — Travel Planner</title>
  </head>
  <body>
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        var root = document.getElementById('root');
        if (root) {
          var errorName = error ? (error.name + ': ') : '';
          var fullMessage = errorName + (error ? error.message : msg);
          var stack = error ? error.stack : '';
          
          // Handle "Script error." which is generic due to CORS or browser interrupts (common on iOS Share)
          if (msg === 'Script error.' || (!url && lineNo === 0)) {
             // If we have a real error object with a stack, it might still be a real issue.
             // But if it's just "Script error." with no info, it's a browser noise event.
             if (!error || !error.stack || error.stack.length < 10) {
                console.warn('Suppressed noisy browser error:', msg);
                return; 
             }
             fullMessage = 'Script Error: An external resource failed. Check console for details.';
          }

          var escapeHtml = function(value) { return String(value || '').replace(/[&<>"']/g, function(char) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]; }); };
          root.innerHTML = '<div style="background:var(--sys-bg-base,#0F1014);color:var(--sys-label-primary,#fff);padding:40px 20px;font-family:-apple-system, system-ui, sans-serif;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">' +
            '<div style="font-size:4rem;margin-bottom:20px;">⚠️</div>' +
            '<h1 style="color:var(--sys-red,#FF3B30);font-size:18px;font-weight:800;letter-spacing:0.05em;margin:0 0 10px 0;">SYSTEM FATAL ERROR</h1>' +
            '<p style="font-size:14px;line-height:1.6;color:var(--sys-label-primary,#fafafa);max-width:500px;margin:0 auto 20px auto;">' + escapeHtml(fullMessage) + '</p>' +
            (stack ? '<div style="font-size:10px;color:var(--sys-label-secondary,#888);background:var(--sys-bg-elevated,rgba(255,255,255,0.05));padding:15px;border-radius:12px;text-align:left;max-width:90%;overflow:auto;max-height:200px;margin-bottom:30px;font-family:monospace;white-space:pre-wrap;">' + escapeHtml(stack) + '</div>' : '') +
            '<p style="font-size:11px;color:var(--sys-label-secondary,#888);margin-bottom:30px;">' + escapeHtml(url || 'unknown-file') + ' (L:' + lineNo + ' C:' + columnNo + ')</p>' +
            '<button onclick="window.location.reload()" style="padding:14px 28px;background:var(--sys-blue,#0a84ff);color:#fff;border:none;border-radius:14px;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 10px 20px rgba(0,0,0,0.3);">RELOAD APP</button>' +
            '</div>';
        }
        return false;
      };
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
