name: Webapp CI

on:
  push:
    branches: [main]
    paths: ['webapp/**', '.github/workflows/webapp-ci.yml']
  pull_request:
    paths: ['webapp/**', '.github/workflows/webapp-ci.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      # --ignore-scripts: firebase-tools' re2 postinstall tries to download/compile natively.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vite build
      - run: npm test
